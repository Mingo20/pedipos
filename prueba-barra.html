<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Prueba de la barra</title>
<link rel="stylesheet" href="css/app.css">
<style>
  body{background:#EEF2F5;display:flex;flex-direction:column;gap:26px;padding:26px;align-items:center;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .caja{width:min(100%,430px);position:relative;height:88px}
  .caja p{font:600 12px system-ui;color:#6B747C;margin:0 0 8px 6px;letter-spacing:.06em;text-transform:uppercase}
  .act{position:relative}
</style>
</head>
<body>
<div class="caja">
  <p>1. Grabando (sin reloj)</p>
  <div class="act grabando rec" id="b1">
    <button class="n">NUEVA</button>
    <button class="c">COBRAR</button>
    <div class="mic grab"><i><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7L6 7Z"/></svg></i></div>
    <div class="recbar">
      <span class="rtrash"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></span>
      <span class="rlock2"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="5" y="10" width="14" height="10" rx="3"/><path class="arco" d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
    </div>
  </div>
</div>

<div class="caja">
  <p>2. Deslizado a la derecha: candado listo</p>
  <div class="act grabando rec lock" id="b2">
    <button class="n">NUEVA</button>
    <button class="c">COBRAR</button>
    <div class="mic grab"><i></i></div>
    <div class="recbar">
      <span class="rtrash"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></span>
      <span class="rlock2 on"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.1"><rect x="5" y="10" width="14" height="10" rx="3"/><path class="arco" d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></span>
    </div>
  </div>
</div>

<div class="caja">
  <p>3. Soltado: el candado se volvio enviar</p>
  <div class="act grabando rec lock" id="b3">
    <button class="n">NUEVA</button>
    <button class="c">COBRAR</button>
    <div class="mic grab" style="display:none"><i></i></div>
    <div class="recbar">
      <span class="rtrash"><svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></span>
      <span class="rlock2 enviar"><svg viewBox="0 0 24 24" width="24" height="24" fill="currentColor"><path d="M3.4 20.4 21 12 3.4 3.6 3.4 10l12 2-12 2z"/></svg></span>
    </div>
  </div>
</div>

<div class="caja">
  <p>4. Manos libres</p>
  <div class="act grabando rec lock" id="b4">
    <button class="n">NUEVA</button>
    <button class="c">COBRAR</button>
    <div class="mic grab" style="display:none"><i></i></div>
    <div class="recbar">
      <div class="rfree">
        <button class="rdel"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M9 7V5h6v2M7 7l1 13h8l1-13"/></svg></button>
        <div class="rwave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        <button class="rpause"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1.5"/><rect x="14" y="5" width="4" height="14" rx="1.5"/></svg></button>
        <button class="rsend"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 7h12l-1 13H7L6 7Z"/></svg></button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
