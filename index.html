<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B8F5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PediPOS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="img/logo-96.png" type="image/png">
<link rel="apple-touch-icon" href="img/logo-192.png">
<link rel="stylesheet" href="css/app.css?v=47">
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <img class="logo" src="img/logo-96.png" alt="PediPOS" width="40" height="40">
    <h1 id="title">PediPOS</h1>
    <button class="ibtn" id="btnBell" aria-label="Avisos"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><i class="dot" id="bellDot" hidden></i></button>
    <button class="ibtn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h16"/></svg></button>
    <button class="avatar" id="btnAvatar" aria-label="Perfil" hidden><span id="avatarTxt">D</span></button>
  </header>
  <div class="instbar" id="instbar" hidden>
    <img class="ii" src="img/logo-96.png" alt="" width="38" height="38">
    <div class="it"><b>Instala PediPOS</b><span id="instsub">Acceso directo y ventas sin internet</span></div>
    <button class="dl" id="instbtn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11M7 11l5 5 5-5M5 20h14"/></svg>Descargar</button>
  </div>
  <div class="netbar" id="netbar" hidden></div>
  <main id="view"></main>
  <div id="float"></div>
  <nav class="dock" id="dock"></nav>
</div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>
<script>/* captura temprana: el aviso de instalacion puede llegar antes que la app */window.__ppInstallPrompt=null;addEventListener("beforeinstallprompt",function(e){e.preventDefault();window.__ppInstallPrompt=e;dispatchEvent(new Event("pp:installable"))});addEventListener("appinstalled",function(){window.__ppInstallPrompt=null;dispatchEvent(new Event("pp:installed"))});</script>
<script src="https://js.puter.com/v2/"></script>
<script src="js/store.js?v=47"></script>
<script src="js/sync.js?v=47"></script>
<script src="js/voice.js?v=47"></script>
<script src="js/extra.js?v=47"></script>
<script src="js/app.js?v=47"></script>
<script>
/* Siempre la ultima version: el service worker se revisa al abrir y cada vez que se vuelve a la app. */
(function(){
  var VERSION="47";
  if(!("serviceWorker"in navigator))return;
  var recargando=false;
  navigator.serviceWorker.addEventListener("controllerchange",function(){
    if(recargando)return; recargando=true;
    /* hay una version nueva activa: recarga para ejecutarla (no si se esta grabando o escribiendo) */
    var a=document.activeElement;
    if(document.body.classList.contains("grabando")||(a&&/INPUT|TEXTAREA/.test(a.tagName))){recargando=false;return;}
    location.reload();
  });
  addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(function(reg){
      var buscar=function(){try{reg.update();}catch(e){}};
      buscar();
      document.addEventListener("visibilitychange",function(){if(!document.hidden)buscar();});
      addEventListener("focus",buscar);
      addEventListener("pageshow",buscar);
      setInterval(buscar,5*60*1000);
      /* si ya habia una version nueva esperando, se activa de inmediato */
      if(reg.waiting)reg.waiting.postMessage("activar");
      reg.addEventListener("updatefound",function(){
        var w=reg.installing; if(!w)return;
        w.addEventListener("statechange",function(){ if(w.state==="installed"&&navigator.serviceWorker.controller)w.postMessage("activar"); });
      });
    }).catch(function(){});
    /* comprobacion extra: compara la version del servidor con la que esta corriendo */
    var chequear=function(){
      fetch("version.json?t="+Date.now(),{cache:"no-store"}).then(function(r){return r.json();}).then(function(v){
        if(v&&String(v.v)!==VERSION){
          var a=document.activeElement;
          if(document.body.classList.contains("grabando")||(a&&/INPUT|TEXTAREA/.test(a.tagName)))return;
          navigator.serviceWorker.getRegistrations().then(function(rs){return Promise.all(rs.map(function(r){return r.update();}));}).finally(function(){location.reload();});
        }
      }).catch(function(){});
    };
    document.addEventListener("visibilitychange",function(){if(!document.hidden)chequear();});
    addEventListener("pageshow",function(e){if(e.persisted)chequear();});
    setTimeout(chequear,4000);
  });
})();
</script>
</body>
</html>
