<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#0B8F5F">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>PediPOS</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon.svg">
<link rel="stylesheet" href="css/app.css?v=10">
</head>
<body>
<div id="app">
  <header class="top" id="top">
    <button class="ibtn" id="btnMenu" aria-label="Menu"><svg viewBox="0 0 24 24" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h11M4 17h16"/></svg></button>
    <h1 id="title">PANEL</h1>
    <button class="ibtn" id="btnBell" aria-label="Avisos"><svg viewBox="0 0 24 24" width="28" height="28" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 8 3 8H3s3-1 3-8"/><path d="M10.3 20a1.9 1.9 0 0 0 3.4 0"/></svg><i class="dot" id="bellDot" hidden></i></button>
    <button class="avatar" id="btnAvatar" aria-label="Perfil"><span id="avatarTxt">D</span></button>
  </header>
  <div class="netbar" id="netbar" hidden></div>
  <main id="view"></main>
  <nav class="dock" id="dock"></nav>
</div>
<div id="layer"></div>
<div class="toast" id="toast" hidden></div>
<script src="https://js.puter.com/v2/"></script>
<script src="js/store.js?v=10"></script>
<script src="js/sync.js?v=10"></script>
<script src="js/voice.js?v=10"></script>
<script src="js/extra.js?v=10"></script>
<script src="js/app.js?v=10"></script>
<script>if("serviceWorker"in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))</script>
</body>
</html>
